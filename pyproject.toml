[project]
name = "tenure"
version = "0.1.0"
description = "AI technician per industrial machine — anomaly detection, RAG-grounded diagnosis, human-in-the-loop feedback"
requires-python = ">=3.11"
dependencies = [
    # ProtoTwin Connect
    "prototwin>=0.1.0",
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    # Database
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    # Vector DB
    "chromadb>=0.5.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    # LLM
    "google-genai>=1.0.0",
    # Time-series anomaly detection
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "torch>=2.3.0",
    # Document processing
    "pypdf>=4.0.0",
    "langchain-text-splitters>=0.2.0",
    # Export
    "reportlab>=4.2.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

